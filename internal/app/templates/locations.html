{{define "locations"}}{{template "base" .}}{{end}}
{{define "content"}}
<aside>
  <h2>Map</h2>
  <p>Photo locations are clustered as you zoom and pan.</p>
  {{range .Locations}}<a class="month{{if and (eq .Kind "settlement") (eq .Name $.SelectedSettlement)}} active{{else if and (eq .Kind "region") (eq .Name $.SelectedRegion)}} active{{end}}" href="/locations?{{.Kind}}={{urlquery .Name}}"{{if and (eq .Kind "settlement") (eq .Name $.SelectedSettlement)}} aria-current="page"{{else if and (eq .Kind "region") (eq .Name $.SelectedRegion)}} aria-current="page"{{end}}>{{.Name}} <span>{{.Count}}</span></a>{{else}}<p>No resolved locations yet.</p>{{end}}
</aside>
<section class="map-section">
  <div class="map-head"><span id="map-status" aria-live="polite"></span></div>
  <div id="photo-map" data-return-url="{{.MapReturnURL}}" data-settlement="{{.SelectedSettlement}}" data-region="{{.SelectedRegion}}" data-cluster-photo-zoom="12"{{with .MapBounds}} data-min-lat="{{.MinLatitude}}" data-min-lng="{{.MinLongitude}}" data-max-lat="{{.MaxLatitude}}" data-max-lng="{{.MaxLongitude}}"{{end}} role="application" aria-label="Map of geotagged photos"></div>
  <div id="cluster-photos" hidden>
    <button type="button" id="cluster-photos-back">Back to map</button>
    <div class="grid"></div>
  </div>
</section>
{{end}}
