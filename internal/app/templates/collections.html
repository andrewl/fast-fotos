{{define "collections"}}{{template "base" .}}{{end}}
{{define "content"}}
<section class="galleries">
  <div class="gallery-head"><h1>Galleries</h1></div>
  <p>THIS IS THE COLLECTIONS TEMPLATE</p>
  {{range .Collections}}
  {{if ne .Name "selected"}}<span hx-delete="/galleries/{{.ID}}">D</span>{{end}}<a class="gallery-link" href="/galleries/{{.ID}}"><strong>{{.Name}}</strong><span>{{.Count}} photos</span></a>
  {{else}}
  <p>No galleries yet. Select photos from the timeline to create one.</p>
  {{end}}
</section>
{{end}}
