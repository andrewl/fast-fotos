{{define "search"}}{{template "base" .}}{{end}}
{{define "content"}}
<aside class="saved-searches">
  <h2>Saved searches</h2>
  {{range .SavedSearches}}
  <div class="saved-search">
    <a href="{{.URL}}">{{.Title}}</a>
    <button type="button" hx-delete="/saved-searches/{{.ID}}" aria-label="Delete {{.Title}}">Delete</button>
  </div>
  {{else}}
  <p>No saved searches.</p>
  {{end}}
</aside>
<section id="gallery">
  <div class="search-filters">
    <h1>Search photos</h1>
    <form method="get" action="/search" data-search-form>
      <label>From <input type="date" name="from" value="{{.Search.DateFrom}}"></label>
      <label>To <input type="date" name="to" value="{{.Search.DateTo}}"></label>
      <label>Label
        <select name="label"><option value="">Any label</option>{{range .Search.Labels}}<option value="{{.}}"{{if eq . $.Search.Label}} selected{{end}}>{{.}}</option>{{end}}</select>
      </label>
      <label>Color
        <select name="color"><option value="">Any color</option>{{range .Search.Colors}}<option value="{{.}}"{{if eq . $.Search.Color}} selected{{end}}>{{.}}</option>{{end}}</select>
      </label>
      <label>Camera
        <select name="camera"><option value="">Any camera</option>{{range .Search.CameraModels}}<option value="{{.}}"{{if eq . $.Search.CameraModel}} selected{{end}}>{{.}}</option>{{end}}</select>
      </label>
      <label>Focal length
        <select name="focal"><option value="">Any focal length</option>{{range .Search.FocalLengths}}<option value="{{.}}"{{if eq . $.Search.FocalLength}} selected{{end}}>{{.}} mm</option>{{end}}</select>
      </label>
      <label>Flash
        <select name="flash"><option value="">Any</option><option value="yes"{{if eq .Search.Flash "yes"}} selected{{end}}>Fired</option><option value="no"{{if eq .Search.Flash "no"}} selected{{end}}>Did not fire</option></select>
      </label>
      <label>Location
        <select name="location"><option value="">Any location</option>{{range .Search.Locations}}<option value="{{.Value}}"{{if eq .Value $.Search.Location}} selected{{end}}>{{.Label}}</option>{{end}}</select>
      </label>
      <label>Sharpness
        <select name="sharpness"><option value="">Any</option><option value="sharp"{{if eq .Search.Sharpness "sharp"}} selected{{end}}>Sharp</option><option value="soft"{{if eq .Search.Sharpness "soft"}} selected{{end}}>Soft</option><option value="blurry"{{if eq .Search.Sharpness "blurry"}} selected{{end}}>Blurry</option></select>
      </label>
      <label>Exposure
        <select name="exposure"><option value="">Any</option><option value="good"{{if eq .Search.Exposure "good"}} selected{{end}}>Well exposed</option><option value="under"{{if eq .Search.Exposure "under"}} selected{{end}}>Underexposed</option><option value="over"{{if eq .Search.Exposure "over"}} selected{{end}}>Overexposed</option></select>
      </label>
      <label>Contrast
        <select name="contrast"><option value="">Any</option><option value="high"{{if eq .Search.Contrast "high"}} selected{{end}}>High</option><option value="medium"{{if eq .Search.Contrast "medium"}} selected{{end}}>Medium</option><option value="low"{{if eq .Search.Contrast "low"}} selected{{end}}>Low</option></select>
      </label>
      <label>Quality
        <select name="quality"><option value="">Any</option><option value="good"{{if eq .Search.Quality "good"}} selected{{end}}>Good</option><option value="fair"{{if eq .Search.Quality "fair"}} selected{{end}}>Fair</option><option value="poor"{{if eq .Search.Quality "poor"}} selected{{end}}>Poor</option></select>
      </label>
      <div class="search-actions">
        <button type="submit">Search</button>
        {{if ne .ReturnURL "/search"}}<button type="button" id="save-search" hx-post="/saved-searches" hx-vals='{"url":"{{.ReturnURL}}"}' hx-swap="none">Save search</button>{{end}}
        <button type="button" onclick="window.location.href='/search'">Clear filters</button>
      </div>
    </form>
  </div>
  {{template "gallery-content" .}}
</section>
{{end}}
