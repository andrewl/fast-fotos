{{define "custom-gallery"}}{{template "base" .}}{{end}}
{{define "content"}}
<aside>
  <h2>Collections</h2>
  {{range .Collections}}<a class="month{{if and $.Collection (eq .ID $.Collection.ID)}} active{{end}}"{{if and $.Collection (eq .ID $.Collection.ID)}} aria-current="page"{{end}} href="/collections/{{.ID}}">{{.Name}} <span>{{.Count}}</span></a>{{else}}
  <p>No collections yet.</p>{{end}}
</aside>
<section id="gallery">{{template "gallery-content" .}}</section>
{{end}}
