services:
  app:
    build: .
    ports:
      - "8090:8090"
    environment:
      DATABASE_PATH: /data/fast-fotos.db
      PHOTO_ROOT: /photos
      INDEX_WORKER: 4
      GEONAMES_DIR: /geonames
      GEONAMES_AUTO_INSTALL: "true"
      OBJECT_MODEL_DIR: /models
      OBJECT_AUTO_INSTALL: "true"
    volumes:
      - type: bind
        source: ${PHOTO_ROOT:-./photos}
        target: /photos
        read_only: true
      - type: bind
        source: ${GEONAMES_DIR:-fast-fotos-geonames}
        target: /geonames
      - type: volume
        source: fast-fotos-models
        target: /models
      - type: volume
        source: fast-fotos-data
        target: /data
volumes:
  fast-fotos-data:
  fast-fotos-geonames:
  fast-fotos-models:
