services:
  app:
    build: .
    ports:
      - "8090:8090"
    environment:
      DATABASE_PATH: /data/fast-fotos.db
      PHOTO_ROOT: /photos
      INDEX_WORKER: 2
      GEONAMES_DIR: /geonames
      GEONAMES_AUTO_INSTALL: "true"
      OBJECT_MODEL_DIR: /models
      OBJECT_AUTO_INSTALL: "true"
      ONNX_INTRA_OP_THREADS: 2
      ONNX_INTER_OP_THREADS: 1
    volumes:
      - ./pf:/photos
      - ./fast-fotos-geonames:/geonames
      - ./fast-fotos-models:/models
      - ./data:/data
